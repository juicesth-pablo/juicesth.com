<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>選曲展示｜Playlists</title>

    <!-- 全站樣式（相對路徑，搬到 /repo/ 也不會壞） -->
    <link rel="stylesheet" href="style.css">

    <!-- 全站共用 JS：defer 讓它在 DOM 解析完才跑 -->
    <script src="main.js" defer></script>
</head>
<body>
     <!-- 流動漸變背景（純裝飾，對輔助技術隱藏） -->
    <div class="bg" aria-hidden="true">
        <div class="bg__blobs">
            <span class="bg__blob bg__blob--1"></span>
            <span class="bg__blob bg__blob--2"></span>
            <span class="bg__blob bg__blob--3"></span>
            <span class="bg__blob bg__blob--4"></span>
        </div>
        <div class="bg__grain"></div>
    </div>
    <main>
        <!-- 之後這裡放 04 hero 與 06 gallery -->
        <h1 style="padding: var(--space-3xl) var(--gutter);">
            選曲展示
        </h1>
    </main>

</body>
</html>
