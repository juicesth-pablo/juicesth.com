<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>juice.sth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&display=swap">
    <link rel="preconnect" href="https://open.spotify.com">
    <link rel="preconnect" href="https://open.spotifycdn.com" crossorigin>
    <link rel="dns-prefetch" href="https://i.scdn.co">
    <link rel="preload" as="image" href="images/wavy.webp">
    <link rel="preload" as="image" href="images/mellow-bars.webp">
    <link rel="preload" as="image" href="images/summer-jam-mixtape.webp">
    <link rel="preload" as="image" href="images/flying-melodies.webp">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <!-- 流動漸變背景（固定不動，內容在上面左右滑動） -->
    <div class="bg" aria-hidden="true">
        <div class="bg__blobs">
            <span class="bg__blob bg__blob--1"></span>
            <span class="bg__blob bg__blob--2"></span>
            <span class="bg__blob bg__blob--3"></span>
            <span class="bg__blob bg__blob--4"></span>
        </div>
        <div class="bg__grain"></div>
    </div>
    <!-- 導覽列：品牌點擊回系列牆 -->
    <header class="nav">
        <button class="glass nav__brand" type="button" data-home>juice.sth</button>
            <div class="glass menu">
                <span class="menu__plus" aria-hidden="true">+</span>
                <div class="menu__links">
                    <a href="https://www.instagram.com/juice.sth/?hl=en" target="_blank" rel="noopener">instagram</a>
                    <a href="https://open.spotify.com/user/11157238419?si=534fa33070ce4a01" target="_blank" rel="noopener">spotify</a>
                </div>
            </div>
    </header>
    <!-- 舞台：固定視窗大小、裁掉水平溢出 -->
    <main class="stage">
        <div class="track" id="track">
            <!-- 面板 0：系列牆 -->
            <section class="panel" aria-label="所有系列">
                <div class="scatter" id="scatter"></div>
            </section>
            <!-- 面板 1：內頁（左 Volume 列表 + 右播放器） -->
            <section class="panel" aria-label="系列內容">
                <header class="panel__head">
                    <button class="back" type="button" data-back aria-label="返回系列牆">←</button>
                    <h2 class="panel__title" id="seriesTitle"></h2>
                </header>
                <div class="detail">
                    <div class="detail__list" id="volumes"></div>
                    <div class="detail__player" id="player"></div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
